<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyAI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">Study<span>AI</span></div>
    <h2 data-i18n="register.title">Crie sua conta gratuita</h2>
    <div id="error-msg" class="form-error" style="display:none"></div>
    <form onsubmit="handleCadastro(event)">
      <div class="form-group">
        <label data-i18n="register.name">Nome completo</label>
        <input type="text" id="nome" data-i18n="register.name_ph" placeholder="Seu nome" required>
      </div>
      <div class="form-group">
        <label data-i18n="login.email">E-mail</label>
        <input type="email" id="email" data-i18n="register.email_ph" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label data-i18n="login.password">Senha</label>
        <input type="password" id="senha" data-i18n="register.pass_ph" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" id="cadastro-btn" data-i18n="register.btn">Criar conta grátis</button>
    </form>
    <div class="auth-link">
      <span data-i18n="register.has_account">Já tem conta?</span> <a href="/login.html" data-i18n="register.login_link">Entrar</a>
    </div>
    <div class="auth-link" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
      <a href="/index.html" data-i18n="login.back">← Voltar para o início</a>
      <div id="lang-selector-wrap"></div>
    </div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/geo.js"></script>
<script>
  redirectIfAuth();
  renderLangSelector('lang-selector-wrap');
  applyTranslations();

  async function handleCadastro(e) {
    e.preventDefault();
    const btn = document.getElementById('cadastro-btn');
    const errEl = document.getElementById('error-msg');
    btn.textContent = t('register.loading');
    btn.disabled = true;
    errEl.style.display = 'none';

    const { ok, data } = await apiFetch('/auth/cadastro', {
      method: 'POST',
      body: JSON.stringify({
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value
      })
    });

    if (ok) {
      setAuth(data.token, data.user);
      window.location.href = '/dashboard.html';
    } else {
      errEl.textContent = data.error || 'Erro ao cadastrar.';
      errEl.style.display = 'block';
      btn.textContent = t('register.btn');
      btn.disabled = false;
    }
  }
</script>
<script src="/js/analytics.js"></script>
</body>
</html>
