<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Público — StudyAI</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="header" id="header"></header>

<div class="public-page">
  <aside class="public-sidebar">
    <div class="sidebar__title" style="margin-bottom:16px">Filtrar por matéria</div>
    <div id="materia-filters"></div>
  </aside>

  <main class="public-main">
    <h1 style="font-family:'Poppins',sans-serif;color:var(--dark-blue);margin-bottom:4px">💬 Chat da Comunidade</h1>
    <p style="color:var(--gray-text);margin-bottom:24px">Compartilhe dúvidas e dicas com outros estudantes.</p>

    <div class="new-post-box">
      <select id="new-post-materia" style="margin-bottom:10px;padding:8px 12px;border:1px solid var(--gray-mid);border-radius:8px;font-size:.85rem;outline:none">
      </select>
      <textarea id="new-post-content" placeholder="Compartilhe uma dúvida, dica ou resumo de estudo..."></textarea>
      <div class="new-post-box__footer">
        <p style="font-size:.75rem;color:var(--gray-text)">Conteúdo moderado por IA</p>
        <button class="btn btn-primary btn-sm" id="post-btn" onclick="submitPost()">Publicar</button>
      </div>
    </div>

    <div id="posts-container"></div>
  </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/geo.js"></script>
<script src="/js/chat-publico.js"></script>
<script src="/js/suporte.js"></script>
<script src="/js/animations.js"></script>
<script>initPublicChat(); applyTranslations(); startCollisionAnimation("posts-container");</script>
<script src="/js/analytics.js"></script>
</body>
</html>
